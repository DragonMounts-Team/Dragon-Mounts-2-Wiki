name: Update changelog
on:
  schedule: [{cron: "17 */6 * * *"}]   # every 6 hours
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]
permissions:
  contents: write
concurrency: changelog
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/update-changelog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No changelog changes."; exit 0; fi
          git config user.name "dm2-wiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/releases.json assets/data.js changelog.html
          git commit -m "chore: update changelog from GitHub releases"
          git push
